    <style>

        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;}
        .container{max-width:1400px;margin:0 auto;}
        h1{color:white;text-align:center;margin-bottom:20px;font-size:2.5em;text-shadow:2px 2px 4px rgba(0,0,0,0.3);}
        .stats{background:white;padding:15px 25px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
        .stat-item{text-align:center;}
        .stat-number{font-size:2em;color:#667eea;font-weight:bold;}
        .stat-label{color:#666;font-size:0.9em;}
        .search-box{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}

        .phonetic-text{color:#667eea;font-size:1.1em;font-style:italic;}
        .speak-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:0.9em;transition:all 0.3s;display:flex;align-items:center;gap:5px;}
        .speak-btn:hover{transform:scale(1.05);box-shadow:0 4px 10px rgba(102,126,234,0.4);}
        .vocab-pos{background:#f0f0f0;padding:8px 12px;border-radius:8px;margin-bottom:10px;}
        .pos-label{color:#764ba2;font-weight:bold;font-size:0.85em;}
        .pos-meaning{color:#333;margin-top:3px;}
        .vocab-story{display:flex;justify-content:space-between;font-size:0.85em;color:#888;border-top:1px solid #e0e0e0;padding-top:10px;margin-top:10px;flex-wrap:wrap;gap:5px;}
        .story-name{color:#667eea;font-weight:500;}
        .no-results{text-align:center;color:white;font-size:1.2em;padding:40px;grid-column:1/-1;}
        .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:30px;flex-wrap:wrap;}
        .page-btn{background:white;color:#667eea;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:16px;transition:all 0.3s;}
        .page-btn:hover:not(:disabled){background:#667eea;color:white;}
        .page-btn:disabled{opacity:0.5;cursor:not-allowed;}
        .page-info{background:white;padding:10px 20px;border-radius:20px;color:#667eea;font-weight:bold;}
        @media(max-width:768px){.vocabulary-list{grid-template-columns:1fr;}.search-controls{flex-direction:column;}h1{font-size:1.8em;}}
    </style>
</head>
<body>

    <script>
const vocabularyData=[{"id":1,"word":"November","translation":"十一月","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":2,"word":"federal","translation":"联邦","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":3,"word":"astronaut","translation":"宇航员","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":4,"word":"academy","translation":"学院","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":5,"word":"vary","translation":"变化","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":6,"word":"crush","translation":"压碎","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":7,"word":"pulse","translation":"脉搏","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":8,"word":"absolutely","translation":"绝对","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":9,"word":"quilt","translation":"被子","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":10,"word":"execute","translation":"执行","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":11,"word":"water","translation":"水","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":12,"word":"coat","translation":"涂层","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":13,"word":"captive","translation":"俘虏","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":14,"word":"pretty","translation":"漂亮的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":15,"word":"true","translation":"真实的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":16,"word":"deep","translation":"深的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":17,"word":"portable","translation":"便携的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":18,"word":"cellar","translation":"地下室","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":19,"word":"dangerous","translation":"危险的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":20,"word":"judgement","translation":"判断","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":21,"word":"loop","translation":"回路","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":22,"word":"straw","translation":"吸管","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":23,"word":"thin","translation":"稀薄的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":24,"word":"telegram","translation":"电报","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":25,"word":"delivery","translation":"递送","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":26,"word":"film","translation":"胶片","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":27,"word":"broken","translation":"破损的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":28,"word":"truck","translation":"卡车","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":29,"word":"cannon","translation":"大炮","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":30,"word":"relief","translation":"轻松","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":31,"word":"shape","translation":"形状","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":32,"word":"film","translation":"拍摄","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":33,"word":"natural","translation":"自然的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":34,"word":"wreck","translation":"残骸","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":35,"word":"silence","translation":"寂静","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":36,"word":"wrap","translation":"包裹","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":37,"word":"spoon","translation":"勺子","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":38,"word":"silent","translation":"寂静的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":39,"word":"adjust","translation":"调整","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":40,"word":"announce","translation":"宣布","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":41,"word":"growth","translation":"成长","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":42,"word":"contribute","translation":"贡献","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":43,"word":"rich","translation":"丰富的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":44,"word":"false","translation":"假的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":45,"word":"flourish","translation":"繁荣","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":46,"word":"my","translation":"我的","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":47,"word":"whether","translation":"是否","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":48,"word":"vote","translation":"选票","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":49,"word":"exhaust","translation":"耗尽","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":50,"word":"mount","translation":"登上","storyName":"宇航女神_星空追梦的传奇","count":1},{"id":51,"word":"control","translation":"控制","storyName":"宇航女神_星空追梦的传奇","count":1}];

let currentPage=1;
const itemsPerPage=50;
let filteredData=[...vocabularyData];

function renderVocabulary(){
    const vocabularyList=document.getElementById('vocabularyList');
    const start=(currentPage-1)*itemsPerPage;
    const end=start+itemsPerPage;
    const pageData=filteredData.slice(start,end);

    if(pageData.length===0){
        vocabularyList.innerHTML='<div class="no-results">未找到匹配的词汇</div>';
        return;
    }

    vocabularyList.innerHTML=pageData.map(v=>{
        return '<div class="vocab-card">'+
            '<span class="vocab-number">#'+v.id+'</span>'+
            '<div class="vocab-word">'+escapeHtml(v.word)+'</div>'+
            '<div class="vocab-phonetic">'+
                '<span class="phonetic-text">'+escapeHtml(v.word)+'</span>'+
                '<button class="speak-btn" onclick="speak(\''+escapeHtml(v.word)+'\')">'+
                    '🔊 发音'+
                '</button>'+
            '</div>'+
            '<div class="vocab-pos">'+
                '<div class="pos-label">中文释义</div>'+
                '<div class="pos-meaning">'+escapeHtml(v.translation)+'</div>'+
            '</div>'+
            '<div class="vocab-story">'+
                '<span class="story-name">'+escapeHtml(v.storyName)+'</span>'+
            '</div>'+
        '</div>';
    }).join('');
}

function renderPagination(){
    const pagination=document.getElementById('pagination');
    const totalPages=Math.ceil(filteredData.length/itemsPerPage);

    if(totalPages<=1){
        pagination.innerHTML='';
        return;
    }

    let html='';
    html+='<button class="page-btn" onclick="changePage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>上一页</button>';
    html+='<span class="page-info">第 '+currentPage+' / '+totalPages+' 页</span>';
    html+='<button class="page-btn" onclick="changePage('+(currentPage+1)+')" '+(currentPage===totalPages?'disabled':'')+'>下一页</button>';

    pagination.innerHTML=html;
}

function changePage(page){
    const totalPages=Math.ceil(filteredData.length/itemsPerPage);
    if(page<1||page>totalPages)return;
    currentPage=page;
    renderVocabulary();
    renderPagination();
    window.scrollTo(0,0);
}

function speak(word){
    const utterance=new SpeechSynthesisUtterance(word);
    utterance.lang='en-US';
    utterance.rate=0.8;
    speechSynthesis.speak(utterance);
}

function escapeHtml(text){
    const div=document.createElement('div');
    div.textContent=text;
    return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input',function(e){
    const searchTerm=e.target.value.toLowerCase();
    filteredData=vocabularyData.filter(v=>{
        return v.word.toLowerCase().includes(searchTerm)||v.translation.includes(searchTerm);
    });
    currentPage=1;
    renderVocabulary();
    renderPagination();
    document.getElementById('filtered-words').textContent=filteredData.length;
});

renderVocabulary();
renderPagination();
    </script>
</body>
</html>
