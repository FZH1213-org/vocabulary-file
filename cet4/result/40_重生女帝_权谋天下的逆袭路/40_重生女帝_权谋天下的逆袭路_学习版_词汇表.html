    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;}
        .container{max-width:1400px;margin:0 auto;}
        h1{color:white;text-align:center;margin-bottom:20px;font-size:2.5em;text-shadow:2px 2px 4px rgba(0,0,0,0.3);}
        .stats{background:white;padding:15px 25px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
        .stat-item{text-align:center;}
        .stat-number{font-size:2em;color:#667eea;font-weight:bold;}
        .stat-label{color:#666;font-size:0.9em;}
        .search-box{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}

        .vocabulary-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px;}
        .vocab-card{background:white;border-radius:15px;padding:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);transition:all 0.3s;}

        .vocab-number{background:#667eea;color:white;padding:3px 10px;border-radius:12px;font-size:0.85em;font-weight:bold;}
        .vocab-word{font-size:1.8em;color:#333;font-weight:bold;margin:10px 0 5px 0;}
        .vocab-phonetic{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
        .phonetic-text{color:#667eea;font-size:1.1em;font-style:italic;}
        .speak-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:0.9em;transition:all 0.3s;display:flex;align-items:center;gap:5px;}
        .speak-btn:hover{transform:scale(1.05);box-shadow:0 4px 10px rgba(102,126,234,0.4);}
        .vocab-pos{background:#f0f0f0;padding:8px 12px;border-radius:8px;margin-bottom:10px;}
        .pos-label{color:#764ba2;font-weight:bold;font-size:0.85em;}
        .pos-meaning{color:#333;margin-top:3px;}
        .vocab-story{display:flex;justify-content:space-between;font-size:0.85em;color:#888;border-top:1px solid #e0e0e0;padding-top:10px;margin-top:10px;flex-wrap:wrap;gap:5px;}
        .story-name{color:#667eea;font-weight:500;}
        .no-results{text-align:center;color:white;font-size:1.2em;padding:40px;grid-column:1/-1;}
        .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:30px;flex-wrap:wrap;}
        .page-btn{background:white;color:#667eea;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:16px;transition:all 0.3s;}
        .page-btn:hover:not(:disabled){background:#667eea;color:white;}
        .page-btn:disabled{opacity:0.5;cursor:not-allowed;}
        .page-info{background:white;padding:10px 20px;border-radius:20px;color:#667eea;font-weight:bold;}
        @media(max-width:768px){.vocabulary-list{grid-template-columns:1fr;}.search-controls{flex-direction:column;}h1{font-size:1.8em;}}
    </style>
</head>
<body>

    <script>
const vocabularyData=[{"id":1,"word":"roof","translation":"屋顶","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":2,"word":"southwest","translation":"西南","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":3,"word":"unexpected","translation":"意外的","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":4,"word":"grace","translation":"优雅","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":5,"word":"dock","translation":"码头","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":6,"word":"index","translation":"索引","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":7,"word":"verify","translation":"核实","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":8,"word":"applicable","translation":"适用的","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":9,"word":"swim","translation":"游泳","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":10,"word":"throne","translation":"王座","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":11,"word":"weapon","translation":"武器","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":12,"word":"medium","translation":"媒介","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":13,"word":"element","translation":"元素","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":14,"word":"bathroom","translation":"浴室","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":15,"word":"position","translation":"职位","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":16,"word":"brave","translation":"勇敢","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":17,"word":"future","translation":"未来","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":18,"word":"wheel","translation":"轮子","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":19,"word":"frank","translation":"坦率的","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":20,"word":"clock","translation":"时钟","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":21,"word":"behind","translation":"后面","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":22,"word":"sudden","translation":"突然的","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":23,"word":"our","translation":"我们的","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":24,"word":"dog","translation":"狗","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":25,"word":"occupy","translation":"占据","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":26,"word":"leap","translation":"跳跃","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":27,"word":"vitamin","translation":"维生素","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":28,"word":"favour","translation":"恩惠","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":29,"word":"strategy","translation":"策略","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":30,"word":"ear","translation":"耳朵","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":31,"word":"battle","translation":"战役","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":32,"word":"arrival","translation":"到达","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":33,"word":"lady","translation":"女士","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":34,"word":"Christian","translation":"基督徒","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":35,"word":"unconscious","translation":"无意识的","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":36,"word":"fun","translation":"娱乐","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":37,"word":"indoors","translation":"室内","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":38,"word":"utilize","translation":"利用","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":39,"word":"kick","translation":"踢","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":40,"word":"tail","translation":"尾巴","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":41,"word":"nobody","translation":"没有人","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":42,"word":"breast","translation":"胸部","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":43,"word":"low","translation":"低下","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":44,"word":"pile","translation":"堆","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":45,"word":"specially","translation":"专门","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":46,"word":"basketball","translation":"篮球","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":47,"word":"stumble","translation":"跌倒","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":48,"word":"living","translation":"生活","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":49,"word":"squirrel","translation":"松鼠","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":50,"word":"feast","translation":"盛宴","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":51,"word":"southwest","translation":"西南","storyName":"重生女帝_权谋天下的逆袭路","count":1},{"id":52,"word":"throne","translation":"王座","storyName":"重生女帝_权谋天下的逆袭路","count":1}];

let currentPage=1;
const itemsPerPage=50;
let filteredData=[...vocabularyData];

function renderVocabulary(){
    const vocabularyList=document.getElementById('vocabularyList');
    const start=(currentPage-1)*itemsPerPage;
    const end=start+itemsPerPage;
    const pageData=filteredData.slice(start,end);

    if(pageData.length===0){
        vocabularyList.innerHTML='<div class="no-results">未找到匹配的词汇</div>';
        return;
    }

    vocabularyList.innerHTML=pageData.map(v=>{
        return '<div class="vocab-card">'+
            '<span class="vocab-number">#'+v.id+'</span>'+
            '<div class="vocab-word">'+escapeHtml(v.word)+'</div>'+
            '<div class="vocab-phonetic">'+
                '<span class="phonetic-text">'+escapeHtml(v.word)+'</span>'+
                '<button class="speak-btn" onclick="speak(\''+escapeHtml(v.word)+'\')">'+
                    '🔊 发音'+
                '</button>'+
            '</div>'+
            '<div class="vocab-pos">'+
                '<div class="pos-label">中文释义</div>'+
                '<div class="pos-meaning">'+escapeHtml(v.translation)+'</div>'+
            '</div>'+
            '<div class="vocab-story">'+
                '<span class="story-name">'+escapeHtml(v.storyName)+'</span>'+
            '</div>'+
        '</div>';
    }).join('');
}

function renderPagination(){
    const pagination=document.getElementById('pagination');
    const totalPages=Math.ceil(filteredData.length/itemsPerPage);

    if(totalPages<=1){
        pagination.innerHTML='';
        return;
    }

    let html='';
    html+='<button class="page-btn" onclick="changePage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>上一页</button>';
    html+='<span class="page-info">第 '+currentPage+' / '+totalPages+' 页</span>';
    html+='<button class="page-btn" onclick="changePage('+(currentPage+1)+')" '+(currentPage===totalPages?'disabled':'')+'>下一页</button>';

    pagination.innerHTML=html;
}

function changePage(page){
    const totalPages=Math.ceil(filteredData.length/itemsPerPage);
    if(page<1||page>totalPages)return;
    currentPage=page;
    renderVocabulary();
    renderPagination();
    window.scrollTo(0,0);
}

function speak(word){
    const utterance=new SpeechSynthesisUtterance(word);
    utterance.lang='en-US';
    utterance.rate=0.8;
    speechSynthesis.speak(utterance);
}

function escapeHtml(text){
    const div=document.createElement('div');
    div.textContent=text;
    return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input',function(e){
    const searchTerm=e.target.value.toLowerCase();
    filteredData=vocabularyData.filter(v=>{
        return v.word.toLowerCase().includes(searchTerm)||v.translation.includes(searchTerm);
    });
    currentPage=1;
    renderVocabulary();
    renderPagination();
    document.getElementById('filtered-words').textContent=filteredData.length;
});

renderVocabulary();
renderPagination();
    </script>
</body>
</html>
