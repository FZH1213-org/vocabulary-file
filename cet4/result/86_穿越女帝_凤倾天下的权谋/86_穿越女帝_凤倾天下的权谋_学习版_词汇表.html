<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词汇学习表 - 穿越女帝_凤倾天下的权谋 - 49个词汇</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;}
        .container{max-width:1400px;margin:0 auto;}
        h1{color:white;text-align:center;margin-bottom:20px;font-size:2.5em;text-shadow:2px 2px 4px rgba(0,0,0,0.3);}
        .stats{background:white;padding:15px 25px;border-radius:10px;margin-bottom:20px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
        .stat-item{text-align:center;}
        .stat-number{font-size:2em;color:#667eea;font-weight:bold;}
        .stat-label{color:#666;font-size:0.9em;}
        .search-box{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
        .search-controls{display:flex;gap:15px;flex-wrap:wrap;}
        .search-input{flex:1;min-width:200px;padding:12px 20px;border:2px solid #e0e0e0;border-radius:25px;font-size:16px;}
        .search-input:focus{outline:none;border-color:#667eea;box-shadow:0 0 10px rgba(102,126,234,0.3);}
        .vocabulary-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px;}
        .vocab-card{background:white;border-radius:15px;padding:20px;box-shadow:0 4px 6px rgba(0,0,0,0.1);transition:all 0.3s;}
        .vocab-card:hover{transform:translateY(-5px);box-shadow:0 8px 15px rgba(0,0,0,0.2);}
        .vocab-number{background:#667eea;color:white;padding:3px 10px;border-radius:12px;font-size:0.85em;font-weight:bold;}
        .vocab-word{font-size:1.8em;color:#333;font-weight:bold;margin:10px 0 5px 0;}
        .vocab-phonetic{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
        .phonetic-text{color:#667eea;font-size:1.1em;font-style:italic;}
        .speak-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:0.9em;transition:all 0.3s;display:flex;align-items:center;gap:5px;}
        .speak-btn:hover{transform:scale(1.05);box-shadow:0 4px 10px rgba(102,126,234,0.4);}
        .vocab-pos{background:#f0f0f0;padding:8px 12px;border-radius:8px;margin-bottom:10px;}
        .pos-label{color:#764ba2;font-weight:bold;font-size:0.85em;}
        .pos-meaning{color:#333;margin-top:3px;}
        .vocab-story{display:flex;justify-content:space-between;font-size:0.85em;color:#888;border-top:1px solid #e0e0e0;padding-top:10px;margin-top:10px;flex-wrap:wrap;gap:5px;}
        .story-name{color:#667eea;font-weight:500;}
        .no-results{text-align:center;color:white;font-size:1.2em;padding:40px;grid-column:1/-1;}
        .pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:30px;flex-wrap:wrap;}
        .page-btn{background:white;color:#667eea;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-size:16px;transition:all 0.3s;}
        .page-btn:hover:not(:disabled){background:#667eea;color:white;}
        .page-btn:disabled{opacity:0.5;cursor:not-allowed;}
        .page-info{background:white;padding:10px 20px;border-radius:20px;color:#667eea;font-weight:bold;}
        @media(max-width:768px){.vocabulary-list{grid-template-columns:1fr;}.search-controls{flex-direction:column;}h1{font-size:1.8em;}}
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 穿越女帝_凤倾天下的权谋</h1>
        <div class="stats">
            <div class="stat-item"><div class="stat-number" id="total-words">49</div><div class="stat-label">总词汇数</div></div>
            <div class="stat-item"><div class="stat-number" id="filtered-words">49</div><div class="stat-label">筛选结果</div></div>
        </div>
        <div class="search-box">
            <div class="search-controls">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索单词或中文释义...">
            </div>
        </div>
        <div class="vocabulary-list" id="vocabularyList"></div>
        <div class="pagination" id="pagination"></div>
    </div>
    <script>
const vocabularyData=[{"id":1,"word":"manager","translation":"经理","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":2,"word":"quote","translation":"引用","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":3,"word":"hurt","translation":"伤害","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":4,"word":"democratic","translation":"民主的","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":5,"word":"definition","translation":"定义","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":6,"word":"shake","translation":"动摇","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":7,"word":"truth","translation":"真相","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":8,"word":"marry","translation":"娶","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":9,"word":"effort","translation":"努力","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":10,"word":"China","translation":"中国","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":11,"word":"bus","translation":"马车","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":12,"word":"sand","translation":"沙地","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":13,"word":"arouse","translation":"唤起","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":14,"word":"shortcoming","translation":"缺点","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":15,"word":"enforce","translation":"执行","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":16,"word":"flock","translation":"聚集","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":17,"word":"tip","translation":"建议","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":18,"word":"knock","translation":"敲","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":19,"word":"whistle","translation":"口哨","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":20,"word":"salary","translation":"薪水","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":21,"word":"whisper","translation":"耳语","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":22,"word":"research","translation":"研究","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":23,"word":"close","translation":"亲近","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":24,"word":"match","translation":"比赛","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":25,"word":"protection","translation":"保护","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":26,"word":"seven","translation":"七","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":27,"word":"crew","translation":"成员","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":28,"word":"installation","translation":"安装","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":29,"word":"it","translation":"这","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":30,"word":"guilty","translation":"内疚","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":31,"word":"majority","translation":"多数","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":32,"word":"friendly","translation":"友好的","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":33,"word":"feel","translation":"感受到","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":34,"word":"Russian","translation":"俄国","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":35,"word":"opposite","translation":"对面","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":36,"word":"crow","translation":"乌鸦","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":37,"word":"risk","translation":"风险","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":38,"word":"afford","translation":"承受得起","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":39,"word":"exception","translation":"例外","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":40,"word":"sweep","translation":"席卷","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":41,"word":"obey","translation":"服从","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":42,"word":"map","translation":"地图","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":43,"word":"responsibility","translation":"责任","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":44,"word":"such","translation":"如此","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":45,"word":"tense","translation":"紧张","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":46,"word":"whom","translation":"谁","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":47,"word":"thunder","translation":"雷声","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":48,"word":"deliver","translation":"实现","storyName":"穿越女帝_凤倾天下的权谋","count":1},{"id":49,"word":"organize","translation":"组织","storyName":"穿越女帝_凤倾天下的权谋","count":1}];

let currentPage=1;
const itemsPerPage=50;
let filteredData=[...vocabularyData];

function renderVocabulary(){
    const vocabularyList=document.getElementById('vocabularyList');
    const start=(currentPage-1)*itemsPerPage;
    const end=start+itemsPerPage;
    const pageData=filteredData.slice(start,end);

    if(pageData.length===0){
        vocabularyList.innerHTML='<div class="no-results">未找到匹配的词汇</div>';
        return;
    }

    vocabularyList.innerHTML=pageData.map(v=>{
        return '<div class="vocab-card">'+
            '<span class="vocab-number">#'+v.id+'</span>'+
            '<div class="vocab-word">'+escapeHtml(v.word)+'</div>'+
            '<div class="vocab-phonetic">'+
                '<span class="phonetic-text">'+escapeHtml(v.word)+'</span>'+
                '<button class="speak-btn" onclick="speak(\''+escapeHtml(v.word)+'\')">'+
                    '🔊 发音'+
                '</button>'+
            '</div>'+
            '<div class="vocab-pos">'+
                '<div class="pos-label">中文释义</div>'+
                '<div class="pos-meaning">'+escapeHtml(v.translation)+'</div>'+
            '</div>'+
            '<div class="vocab-story">'+
                '<span class="story-name">'+escapeHtml(v.storyName)+'</span>'+
            '</div>'+
        '</div>';
    }).join('');
}

function renderPagination(){
    const pagination=document.getElementById('pagination');
    const totalPages=Math.ceil(filteredData.length/itemsPerPage);

    if(totalPages<=1){
        pagination.innerHTML='';
        return;
    }

    let html='';
    html+='<button class="page-btn" onclick="changePage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>上一页</button>';
    html+='<span class="page-info">第 '+currentPage+' / '+totalPages+' 页</span>';
    html+='<button class="page-btn" onclick="changePage('+(currentPage+1)+')" '+(currentPage===totalPages?'disabled':'')+'>下一页</button>';

    pagination.innerHTML=html;
}

function changePage(page){
    const totalPages=Math.ceil(filteredData.length/itemsPerPage);
    if(page<1||page>totalPages)return;
    currentPage=page;
    renderVocabulary();
    renderPagination();
    window.scrollTo(0,0);
}

function speak(word){
    const utterance=new SpeechSynthesisUtterance(word);
    utterance.lang='en-US';
    utterance.rate=0.8;
    speechSynthesis.speak(utterance);
}

function escapeHtml(text){
    const div=document.createElement('div');
    div.textContent=text;
    return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input',function(e){
    const searchTerm=e.target.value.toLowerCase();
    filteredData=vocabularyData.filter(v=>{
        return v.word.toLowerCase().includes(searchTerm)||v.translation.includes(searchTerm);
    });
    currentPage=1;
    renderVocabulary();
    renderPagination();
    document.getElementById('filtered-words').textContent=filteredData.length;
});

renderVocabulary();
renderPagination();
    </script>
</body>
</html>
